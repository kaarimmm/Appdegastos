<!doctype html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14213D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Deudas">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Mis deudas</title>
<style>
:root{--bg:#EEF1F5;--card:#fff;--ink:#14213D;--mute:#5B6678;--line:#D9DFE8;--ok:#0F766E;--int:#B45309;--tick:#CBD3DF;--bad:#B42318}
@media(prefers-color-scheme:dark){:root{--bg:#0E1626;--card:#16223A;--ink:#EAF0FA;--mute:#9AA7BD;--line:#26334D;--ok:#2DD4BF;--int:#F59E0B;--tick:#2C3A57;--bad:#F97066}}
[hidden]{display:none!important}
*{-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.4 system-ui,-apple-system,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:560px;margin:0 auto;padding:12px 16px 110px}
h1{font:600 26px/1.2 ui-serif,Georgia,serif;margin:4px 0 12px}
h2{font-size:16px;color:var(--mute);font-weight:600;margin:26px 0 8px}
.back{display:inline-block;color:var(--ok);text-decoration:none;padding:10px 0}
.lbl{margin:0;font-size:13px;color:var(--mute)}
.empty{color:var(--mute);margin:28px 0}
.list{background:var(--card);border-radius:14px;overflow:hidden;margin-top:12px}
.list.pad{padding:4px 16px}
.item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px;border-top:1px solid var(--line);color:inherit;text-decoration:none}
.item:first-child{border-top:0}
.item.col{display:block}
.item small,.item span>small{display:block;color:var(--mute);font-size:14px}
.between{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.list.pad .between{padding:11px 0;border-top:1px solid var(--line)}
.list.pad .between:first-child{border-top:0}
.int b{color:var(--int)}
.amt{font:600 18px ui-serif,Georgia,serif;white-space:nowrap}
.ticks{display:flex;gap:3px;margin:10px 0 2px}
.ticks i{flex:1;height:9px;border-radius:2px;background:var(--tick)}
.ticks i.on{background:var(--ok)}
.btn{font:inherit;font-weight:600;border:0;border-radius:12px;padding:14px 16px;background:var(--ink);color:var(--bg);cursor:pointer;width:100%;text-align:center}
.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.4}
.acts{display:grid;gap:10px;margin-top:16px}
.fab{position:fixed;left:16px;right:16px;max-width:528px;margin:auto;bottom:calc(16px + env(safe-area-inset-bottom));text-align:center;text-decoration:none;box-shadow:0 6px 20px rgba(20,33,61,.25)}
.link{background:none;border:0;color:var(--ok);font:inherit;padding:10px 14px 10px 0;text-decoration:none;cursor:pointer}
.link.danger{color:var(--bad)}
.foot{margin-top:22px}
label{display:block;margin-top:14px;font-size:15px;color:var(--mute)}
input,select{display:block;width:100%;box-sizing:border-box;margin-top:6px;padding:12px;font:inherit;font-size:17px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px}
.chk{display:flex;align-items:center;gap:10px;color:var(--ink)}
.chk input{width:auto;margin:0}
:focus-visible{outline:3px solid var(--ok);outline-offset:2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dash{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0 16px}
.card-d{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.card-d.pri{border-color:var(--ok)}
.big-d{margin:4px 0 0;font:600 22px/1.1 ui-serif,Georgia,serif}
.cards{display:grid;gap:12px;margin-top:12px}
.acct{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:block;color:inherit;text-decoration:none}
.badge{font-size:12px;background:var(--bg);padding:3px 8px;border-radius:6px;color:var(--mute);font-weight:600}
.version{text-align:center;color:var(--mute);font-size:13px;margin-top:30px}
</style></head>
<body><main id="app"></main>
<script>
const K='appgastos.v1';
let db;try{db=JSON.parse(localStorage.getItem(K))}catch(e){}
db=db&&db.cuentas&&db.deudas?db:{cuentas:[],deudas:[]};
const save=()=>{try{localStorage.setItem(K,JSON.stringify(db))}catch(e){}};
const $=document.getElementById('app');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const fmt=n=>'$ '+Math.round(n).toLocaleString('es-AR');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cuota=d=>d.total/d.cuotas, resta=d=>(d.cuotas-d.pagadas)*cuota(d), sum=a=>a.reduce((s,d)=>s+resta(d),0);
const cuotaMes=d=>d.pagadas<d.cuotas?cuota(d):0, sumaMes=a=>a.reduce((s,d)=>s+cuotaMes(d),0);
const TIPOS={tarjeta:'Tarjetas',prestamo:'Préstamos',otro:'Otras deudas'};
const ticks=d=>'<div class="ticks" aria-hidden="true">'+Array.from({length:d.cuotas},(_,i)=>'<i class="'+(i<d.pagadas?'on':'')+'"></i>').join('')+'</div>';

const getMesKey=()=> {
 const now=new Date();
 return now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
};

const infoFechas=(d,c)=>{
 const q=d.cuotas-d.pagadas;if(q<=0)return 'Pagada completa';
 const dia=c?.diaVencimiento||10;
 const now=new Date();let y=now.getFullYear(),m=now.getMonth();
 if(now.getDate()>dia)m++;
 const nextD=new Date(y,m,dia).toLocaleDateString('es-AR',{month:'short',year:'numeric'});
 const lastD=new Date(y,m+q-1,dia).toLocaleDateString('es-AR',{month:'short',year:'numeric'});
 return `Quedan ${q} · Próxima: el ${dia} (${nextD}) · Fin: ${lastD}`;
};

function vHome(){
 let h='<div class="dash"><div class="card-d pri"><p class="lbl">Este mes pagás</p><p class="big-d">'+fmt(sumaMes(db.deudas))+'</p></div><div class="card-d"><p class="lbl">Total acumulado</p><p class="big-d">'+fmt(sum(db.deudas))+'</p></div></div>';
 if(!db.cuentas.length)h+='<p class="empty">Todavía no cargaste nada. Tocá «Nueva cuenta» para empezar.</p>';
 for(const t in TIPOS){const cs=db.cuentas.filter(c=>c.tipo===t);if(!cs.length)continue;
  h+='<h2>'+TIPOS[t]+'</h2><div class="cards">'+cs.map(c=>{const ds=db.deudas.filter(d=>d.cuentaId===c.id);
   return '<a class="acct" href="#/c/'+c.id+'"><div class="between"><b>'+esc(c.nombre)+'</b><span class="badge">Vence el '+(c.diaVencimiento||10)+'</span></div>'+
          '<div class="between" style="margin-top:10px;padding-top:10px;border-top:1px solid var(--line)">'+
          '<div><small style="color:var(--mute);font-size:12px">Este mes</small><div style="font-weight:700">'+fmt(ds.reduce((s,d)=>s+cuotaMes(d),0))+'</div></div>'+
          '<div style="text-align:right"><small style="color:var(--mute);font-size:12px">Total</small><div class="amt">'+fmt(sum(ds))+'</div></div></div></a>'}).join('')+'</div>'}
 if(db.cuentas.length)h+='<p class="foot"><button class="link" data-act="exportar">Guardar respaldo</button><button class="link" data-act="importar">Restaurar respaldo</button></p>';
 h+='<p class="version">Versión 2.0</p>';
 return h+'<a class="btn fab" href="#/nueva">Nueva cuenta</a>';
}

function vCuenta(id){const c=db.cuentas.find(x=>x.id===id);if(!c)return vHome();const ds=db.deudas.filter(d=>d.cuentaId===id);
 let h='<a class="back" href="#/">‹ Inicio</a><h1>'+esc(c.nombre)+'</h1><div class="dash"><div class="card-d pri"><p class="lbl">Este mes</p><p class="big-d">'+fmt(ds.reduce((s,d)=>s+cuotaMes(d),0))+'</p></div><div class="card-d"><p class="lbl">Total cuenta</p><p class="big-d">'+fmt(sum(ds))+'</p></div></div>';
 if(ds.some(d=>d.pagadas<d.cuotas)){
  h+='<div style="margin-bottom:14px"><button class="btn" data-act="pagarResumen" data-id="'+id+'">✓ Pagar resumen completo (Vence el '+(c.diaVencimiento||10)+')</button></div>';
 }
 h+=ds.length?'<div class="list">'+ds.map(d=>{
  const q=d.cuotas-d.pagadas;
  const montoMostrar=q>0?fmt(cuota(d)):'Pagada';
  return '<a class="item col" href="#/d/'+d.id+'"><span class="between"><b>'+esc(d.desc)+'</b><span class="amt">'+montoMostrar+'</span></span><small>'+infoFechas(d,c)+'</small>'+ticks(d)+'</a>'}).join('')+'</div>':'<p class="empty">Esta cuenta no tiene deudas.</p>';
 h+='<p class="foot"><button class="link danger" data-act="borrarC" data-id="'+id+'">Eliminar cuenta</button></p>';
 return h+'<a class="btn fab" href="#/c/'+id+'/nueva">'+(c.tipo==='tarjeta'?'Agregar compra':'Agregar deuda')+'</a>'}

function vDeuda(id){const d=db.deudas.find(x=>x.id===id);if(!d)return vHome();const c=db.cuentas.find(x=>x.id===d.cuentaId);const q=d.cuotas-d.pagadas;
 const row=(a,b,cl)=>'<div class="between '+(cl||'')+'"><span>'+a+'</span><b>'+b+'</b></div>';
 let h='<a class="back" href="#/c/'+d.cuentaId+'">‹ Volver</a><h1>'+esc(d.desc)+'</h1><p class="lbl">Te falta pagar</p><p class="big" style="font:600 36px/1.1 ui-serif,Georgia,serif;margin:0 0 6px">'+fmt(resta(d))+'</p>'+ticks(d);
 h+='<p class="sub">'+infoFechas(d,c)+'</p>';
 h+='<div class="list pad">'+row('Cuotas pagadas',d.pagadas+' de '+d.cuotas)+row('Valor cuota',fmt(cuota(d)))+row('Total general',fmt(d.total))+row('Vencimiento', 'Día '+(c?.diaVencimiento||10));
 if(d.recibido){const i=d.total-d.recibido;h+=row('Recibiste',fmt(d.recibido))+row('Interés',fmt(i)+' ('+Math.round(i/d.recibido*100)+'%)','int')}
 h+='</div><div class="acts"><button class="btn" data-act="pagar" data-id="'+id+'"'+(q<1?' disabled':'')+'>Pagué una cuota</button></div>';
 return h+'<p class="foot"><a class="link" href="#/d/'+id+'/editar">Editar</a><button class="link danger" data-act="borrarD" data-id="'+id+'">Eliminar</button></p>';}

const fld=(l,n,v,m)=>'<label>'+l+'<input name="'+n+'" value="'+esc(v==null?'':v)+'" inputmode="'+(m||'text')+'" autocomplete="off"></label>';
function campos(d){const ci=!!(d&&d.recibido);
 return '<label class="chk"><input type="checkbox" name="int"'+(ci?' checked':'')+'> Tiene interés</label><div class="si"'+(ci?'':' hidden')+'>'+fld('Lo que recibiste','recibido',d&&d.recibido,'decimal')+'</div>'+
        fld('Total a pagar ($)','total',d&&d.total,'decimal')+
        '<div class="grid2">'+fld('Cantidad cuotas','cuotas',d&&d.cuotas,'numeric')+fld('Pagadas','pagadas',d?d.pagadas:0,'numeric')+'</div>'}
function fDeuda(d,cid){
 return '<a class="back" href="'+(d?'#/d/'+d.id:'#/c/'+cid)+'">‹ Cancelar</a><h1>'+(d?'Editar deuda':'Nueva deuda')+'</h1><form data-f="deuda" data-id="'+(d?d.id:'')+'" data-cid="'+(cid||'')+'">'+fld('Qué es (ej. Heladera)','desc',d&&d.desc)+campos(d)+'<button class="btn" style="margin-top:22px">Guardar</button></form>'}
function fCuenta(){
 return '<a class="back" href="#/">‹ Cancelar</a><h1>Nueva cuenta</h1><form data-f="cuenta">'+fld('Nombre (ej. Naranja)','nombre','')+fld('📅 Día de vencimiento (1 al 31)','diaVencimiento','10','numeric')+
        '<label>Tipo<select name="tipo"><option value="tarjeta">Tarjeta de crédito</option><option value="prestamo">Préstamo</option><option value="otro">Otra deuda</option></select></label>'+
        '<div class="solo" hidden>'+campos(null)+'</div><button class="btn" style="margin-top:22px">Guardar</button></form>'}

function render(keep){
 const r=location.hash.slice(2).split('/');let h;
 if(r[0]==='c'&&r[2]==='nueva')h=fDeuda(null,r[1]);
 else if(r[0]==='c')h=vCuenta(r[1]);
 else if(r[0]==='d'&&r[2]==='editar')h=db.deudas.some(x=>x.id===r[1])?fDeuda(db.deudas.find(x=>x.id===r[1])):vHome();
 else if(r[0]==='d')h=vDeuda(r[1]);
 else if(r[0]==='nueva')h=fCuenta();
 else h=vHome();
 $.innerHTML=h;if(keep!==true)window.scrollTo(0,0)}

document.addEventListener('submit',e=>{e.preventDefault();const f=e.target,v=Object.fromEntries(new FormData(f)),k=f.dataset.f;
 const nn=s=>{if(!s)return 0;let c=String(s).trim().replace(/\./g,'').replace(',','.');return parseFloat(c)||0;};
 const leer=()=>{
  const total=nn(v.total), cuotas=parseInt(v.cuotas,10), pagadas=parseInt(v.pagadas||0,10), rec=v.int?nn(v.recibido):null;
  if(!(total>0)){alert('Revisá el monto total.');return null}
  if(!(cuotas>=1&&cuotas<=120)){alert('La cantidad de cuotas debe ser entre 1 y 120.');return null}
  if(!(pagadas>=0&&pagadas<=cuotas)){alert('Las cuotas pagadas no pueden superar al total de cuotas.');return null}
  if(v.int&&!(rec>0)){alert('Revisá el monto recibido.');return null}
  return{total,cuotas,pagadas,recibido:rec}};
 if(k==='cuenta'){const n=(v.nombre||'').trim();if(!n){alert('Poné un nombre.');return}const diaV=parseInt(v.diaVencimiento,10)||10;
  if(!(diaV>=1&&diaV<=31)){alert('El día de vencimiento debe estar entre 1 y 31.');return}
  let d=null;if(v.tipo!=='tarjeta'){d=leer();if(!d)return}
  const c={id:uid(),tipo:v.tipo,nombre:n,diaVencimiento:diaV};db.cuentas.push(c);if(d)db.deudas.push({id:uid(),cuentaId:c.id,desc:n,...d});save();location.hash='#/c/'+c.id}
 else{const s=(v.desc||'').trim();if(!s){alert('Poné qué es.');return}const d=leer();if(!d)return;
  if(f.dataset.id){Object.assign(db.deudas.find(x=>x.id===f.dataset.id),{desc:s,...d});save();location.hash='#/d/'+f.dataset.id}
  else{db.deudas.push({id:uid(),cuentaId:f.dataset.cid,desc:s,...d});save();location.hash='#/c/'+f.dataset.cid}}
});
document.addEventListener('change',e=>{const t=e.target;
 if(t.name==='int')t.closest('form').querySelector('.si').hidden=!t.checked;
 if(t.name==='tipo')t.closest('form').querySelector('.solo').hidden=t.value==='tarjeta'});

async function exportar(){const t=JSON.stringify(db);try{if(navigator.share){await navigator.share({title:'Respaldo',text:t});return}}catch(e){}
 try{await navigator.clipboard.writeText(t);alert('Respaldo copiado.')}catch(e){prompt('Copiá:',t)}}
function importar(){const t=prompt('Pegá acá el respaldo:');if(!t)return;
 try{const d=JSON.parse(t);if(!Array.isArray(d.cuentas)||!Array.isArray(d.deudas))throw 0;
  if(!confirm('¿Reemplazar datos?'))return;db=d;save();render()}catch(e){alert('No es válido.')}}

document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;
 const a=b.dataset.act,id=b.dataset.id,d=db.deudas.find(x=>x.id===id);
 const currentMes=getMesKey();

 if(a==='pagar'&&d&&d.pagadas<d.cuotas){
  if(d.ultimoPagoMes===currentMes){
   alert('Esta cuota ya fue registrada como pagada en este mes. El próximo pago estará disponible el mes que viene.');
   return;
  }
  if(confirm('¿Confirmar el pago de 1 cuota para «'+d.desc+'»?')){
   d.pagadas++; d.ultimoPagoMes=currentMes; save(); render(true);
  }
 }
 else if(a==='pagarResumen'){
  const c=db.cuentas.find(x=>x.id===id);
  const pend=db.deudas.filter(x=>x.cuentaId===id&&x.pagadas<x.cuotas&&x.ultimoPagoMes!==currentMes);
  if(!pend.length){alert('Todas las deudas de esta cuenta ya tienen su cuota registrada como pagada en este mes.');return;}
  if(confirm('¿Confirmás el pago del resumen de «'+c.nombre+'» para este mes?')){
   pend.forEach(x=>{
    x.pagadas++; x.ultimoPagoMes=currentMes;
   });
   save(); render(true);
  }
 }
 else if(a==='borrarD'&&d&&confirm('¿Eliminar deuda?')){db.deudas=db.deudas.filter(x=>x!==d);save();location.hash='#/c/'+d.cuentaId}
 else if(a==='borrarC'&&confirm('¿Eliminar cuenta?')){db.cuentas=db.cuentas.filter(c=>c.id!==id);db.deudas=db.deudas.filter(x=>x.cuentaId!==id);save();location.hash='#/'}
 else if(a==='exportar')exportar();else if(a==='importar')importar()});
window.addEventListener('hashchange',()=>render());render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
